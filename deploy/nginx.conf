# nginx reverse proxy for stream.example.com
#   sudo cp deploy/nginx-stream.conf /etc/nginx/sites-available/media-relay
#   sudo ln -s /etc/nginx/sites-available/media-relay /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d stream.example.com      (free HTTPS, auto-renews)
server {
    listen 80;
    listen [::]:80;
    server_name stream.example.com;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;

        # video: pass bytes straight through, no buffering, long reads
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
